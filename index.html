<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<meta name="description" content="熄灯盘：按下一格会同时翻转上下左右。每一关的最少按键数都是 GF(2) 陪集枚举算出来的，并在 4×4 上被按键图广度优先搜索全量复核过。">
<link rel="icon" href="art/icons/icon-16.png" sizes="16x16" type="image/png">
<link rel="icon" href="art/icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="art/icons/icon-48.png" sizes="48x48" type="image/png">
<link rel="icon" href="art/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="art/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta property="og:type" content="website">
<meta property="og:site_name" content="熄灯盘 Lights Out">
<meta property="og:title" content="熄灯盘 · LIGHTSOUT — 盘上的数字是量出来的">
<meta property="og:description" content="每一关的最少按键数由 GF(2) 陪集枚举算出，4×4 全部 65536 个盘面被按键图 BFS 复核，0 处不一致。">
<meta property="og:image" content="art/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="深色电木盘面上 4×4 盏灯，中央 2×2 还亮着">
<meta property="og:locale" content="zh_CN">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="熄灯盘 · LIGHTSOUT">
<meta name="twitter:description" content="一关的最少按键数是算出来的，不是估的。">
<meta name="twitter:image" content="art/og.png">
<meta name="color-scheme" content="dark">
<title>熄灯盘 · LIGHTSOUT</title>
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<header class="topbar">
  <h1 class="brand"><span class="brand-mark">◉</span>熄灯盘<small>LIGHTSOUT</small></h1>
  <nav class="modes" id="modes" aria-label="模式">
    <button type="button" data-mode="campaign">关卡</button>
    <button type="button" data-mode="daily">每日</button>
  </nav>
  <p class="totals" id="totals"></p>
</header>

<main class="stage">
  <section class="board">
    <canvas id="panel" aria-label="熄灯盘"></canvas>
    <p class="hint-line" id="hintline"></p>
    <div class="curtain" id="curtain" hidden>
      <div class="curtain-card">
        <p class="stars" id="stars"></p>
        <h2 id="verdict"></h2>
        <p class="tally" id="tally"></p>
        <p class="answer" id="answer"></p>
        <div class="curtain-actions">
          <button type="button" id="review">回看答案</button>
          <button type="button" id="again">再来一次</button>
          <button type="button" id="next" class="primary">下一关</button>
        </div>
      </div>
    </div>
  </section>

  <aside class="panel">
    <p class="crumbs" id="crumbs"></p>
    <dl class="readout" id="readout"></dl>
    <div class="controls">
      <button type="button" id="undo">撤销</button>
      <button type="button" id="answer-key">答案</button>
      <button type="button" id="restart">重开</button>
    </div>
    <div class="shelf" id="shelf"></div>
    <details class="about">
      <summary>这一关的数字从哪来</summary>
      <p id="about"></p>
      <p class="save">存档只写在这台设备的 localStorage 里。<button type="button" id="wipe">清空存档</button></p>
    </details>
  </aside>
</main>

<script type="module" src="js/main.js"></script>
<script>
  // file:// 下既没有 SW 也没有可信 origin，整段跳过而不是等它抛；注册失败（Pages 上
  // 被 CSP 拒、或用户关了存储）也只静默记录，一个谜题游戏不该因为装不上离线壳而白屏。
  if (location.protocol === 'http:' || location.protocol === 'https:') {
    if ('serviceWorker' in navigator) {
      addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((err) => {
          console.warn('service worker 未注册：', err && err.message);
        });
      });
    }
  }
</script>
</body>
</html>
