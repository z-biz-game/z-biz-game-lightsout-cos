name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The algebra and the shipped pool are pure ES modules: no browser, no install step.
  # library.test.mjs is the one that matters here — it re-solves every line of
  # js/data/lots.js, so a hand-edited par or a stale bake fails the build. The gf2-vs-bfs
  # suite sweeps all 65536 4x4 boards, which is the second, independent leg of "最少按几次".
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: npm run check
      - name: Suites
        run: npm run unit
      # 文档印出去的每一个数都由等式重测：代码改了字、文档还在引用上一个世界的数，这一步红。
      - name: Documentation figures
        run: node tools/doctest.mjs
      # 上面那条闸自己有没有咬合力，由这份台账逐把刀回答。
      - name: Ledger trips the assertion each knife names
        run: python3 tools/sabotage.py

  # The shell is only proven by driving a real page with real mouse events.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Headless playtest
        env:
          SKIP_UNIT: 1
          WD_TIMEOUT: 240
        run: bash tools/verify.sh
